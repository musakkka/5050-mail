<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>5050 demo stage</title>
<style>
  /* 5050 brand: Riso paper, three spot inks, one ink black. Spot inks are fills, never text. */
  @font-face { font-family: Archivo; src: url(fonts/archivo-latin-standard-normal.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  :root {
    --lime: #B5ED13; --aqua: #16C8F4; --pink: #FF48B0; --sun: #FFB511;
    --ink: #1C1A24; --ink2: #47424F; --ink3: #6E6878;
    --paper: #F4EFE3; --paper-hi: #FBF8F0; --paper-lo: #EAE3D2; --edge: #D9D0BB;
    --term: #15131B;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { font-family: Archivo, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }

  /* ---------------------------------------------------------------- background */
  #bg { position: relative; width: 1920px; height: 1080px; background: var(--paper); overflow: hidden; }
  #bg .halftone { position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(22,200,244,.20) 1.6px, transparent 1.9px);
    background-size: 14px 14px;
    -webkit-mask-image: radial-gradient(ellipse 60% 70% at 100% 100%, #000 0%, transparent 70%);
  }
  #bg .halftone.lime { background-image: radial-gradient(circle, rgba(181,237,19,.35) 1.6px, transparent 1.9px);
    -webkit-mask-image: radial-gradient(ellipse 55% 60% at 0% 0%, #000 0%, transparent 70%); background-position: 7px 7px; }
  .grain { position: absolute; inset: 0; opacity: .5; mix-blend-mode: multiply; }

  /* ---------------------------------------------------------------- browser bar */
  #bar { width: 1584px; height: 44px; background: var(--paper-hi); box-sizing: border-box; border-bottom: 2px solid var(--ink);
    display: flex; align-items: center; position: relative; }
  #bar .dots { display: flex; gap: 9px; padding-left: 18px; }
  #bar .dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--ink); box-sizing: border-box; }
  #bar .url { position: absolute; left: 50%; transform: translateX(-50%); height: 28px; min-width: 460px; padding: 0 18px; box-sizing: border-box;
    border-radius: 14px; background: var(--paper-lo); display: flex; align-items: center; justify-content: center; gap: 8px;
    font: 400 14px/1 'JetBrains Mono', monospace; color: var(--ink2); }
  #bar .url b { color: var(--ink); font-weight: 600; }

  /* ---------------------------------------------------------------- window frame (mask + border) */
  #frame { width: 1584px; height: 946px; position: relative; }
  #frame .fill { position: absolute; inset: 0; border-radius: 14px; background: #fff; }
  #frame .border { position: absolute; inset: 0; border-radius: 14px; border: 2px solid var(--ink); box-sizing: border-box; }

  /* ---------------------------------------------------------------- cursor + click ring */
  #cursor { width: 40px; height: 40px; }
  #ring { width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
  #ring div { width: 112px; height: 112px; border-radius: 50%; background: rgba(181,237,19,.45); border: 4px solid var(--lime); box-sizing: border-box; }

  /* ---------------------------------------------------------------- terminal */
  #term { padding: 0 14px 14px 0; width: 1040px; box-sizing: content-box; }
  #term .win { background: var(--term); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 12px 12px 0 var(--aqua); overflow: hidden; }
  #term .head { height: 38px; display: flex; align-items: center; padding: 0 16px; gap: 8px; border-bottom: 1px solid #2B2833; }
  #term .head .dot { width: 12px; height: 12px; border-radius: 50%; }
  #term .head .title { flex: 1; text-align: center; font: 400 13px/1 'JetBrains Mono', monospace; color: #8E8899; margin-right: 52px; }
  #term pre { margin: 0; padding: 20px 24px 24px; font: 400 17px/1.62 'JetBrains Mono', monospace; color: var(--paper); white-space: pre; min-height: 180px; }
  #term .p { color: #8E8899; }
  #term .caret { display: inline-block; width: 10px; height: 20px; background: var(--lime); vertical-align: -4px; margin-left: 1px; }
  #term .ok { display: inline-block; background: var(--lime); color: var(--ink); font-weight: 600; padding: 1px 8px; border-radius: 4px; margin-right: 12px; }
  #term .out { color: var(--paper); }

  /* ---------------------------------------------------------------- cards */
  #card { position: relative; width: 1920px; height: 1080px; background: var(--paper); overflow: hidden; }
  #card .inner { position: absolute; left: 190px; right: 190px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  #card .mark { position: relative; width: 330px; height: 143px; margin-bottom: 54px; }
  #card .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #card .kicker { font: 600 22px/1 'JetBrains Mono', monospace; letter-spacing: .08em; color: var(--ink2); margin-bottom: 26px; display: flex; align-items: center; gap: 14px; }
  #card .kicker i { display: inline-block; width: 14px; height: 14px; background: var(--lime); border: 2px solid var(--ink); }
  #card h1 { margin: 0; font-weight: 900; font-stretch: 112%; font-size: 158px; line-height: .92; letter-spacing: -.02em; }
  #card h1 .hl { position: relative; display: inline-block; z-index: 0; }
  #card h1 .hl::before { content: ''; position: absolute; left: -10px; right: -14px; top: 38%; bottom: -2%; background: var(--lime); z-index: -1;
    transform-origin: left center; transform: rotate(-1.2deg) scaleX(var(--hl, 1)); }
  #card p { margin: 34px 0 0; font-size: 40px; line-height: 1.25; font-weight: 450; font-stretch: 100%; color: var(--ink2); max-width: 1250px; }
  #card .cmd { margin-top: 46px; align-self: flex-start; background: var(--term); color: var(--paper); border: 2px solid var(--ink); border-radius: 14px;
    box-shadow: 10px 10px 0 var(--lime); padding: 22px 30px; font: 400 26px/1.3 'JetBrains Mono', monospace; }
  #card .cmd .p { color: #8E8899; }
  #card .foot { margin-top: 44px; font: 400 24px/1 'JetBrains Mono', monospace; color: var(--ink2); }
  #card .foot b { color: var(--ink); font-weight: 600; }
  #card .tag { position: absolute; right: 64px; bottom: 56px; font: 600 18px/1 'JetBrains Mono', monospace; letter-spacing: .08em; color: var(--ink3); }
</style>
</head>
<body>
<div id="bg" class="hidden"><div class="halftone"></div><div class="halftone lime"></div>
  <svg class="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .11  0 0 0 0 .10  0 0 0 0 .14  0 0 0 .09 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>

<div id="bar" class="hidden">
  <div class="dots"><div class="dot" style="background:var(--pink)"></div><div class="dot" style="background:var(--sun)"></div><div class="dot" style="background:var(--lime)"></div></div>
  <div class="url"><svg width="12" height="14" viewBox="0 0 12 14"><rect x="1" y="6" width="10" height="7.5" rx="1.5" fill="#47424F"/><path d="M3.2 6V4.2a2.8 2.8 0 0 1 5.6 0V6" stroke="#47424F" stroke-width="1.6" fill="none"/></svg><span id="url"></span></div>
</div>

<div id="frame" class="hidden"><div class="fill"></div></div>
<div id="frameBorder" class="hidden" style="width:1584px;height:946px;position:relative"><div style="position:absolute;inset:0;border-radius:14px;border:2px solid #1C1A24;box-sizing:border-box"></div></div>

<div id="cursor" class="hidden"><svg width="40" height="40" viewBox="0 0 40 40"><path d="M8 4 L8 30 L14.5 24 L19 34.5 L23.5 32.5 L19 22.5 L28 22.5 Z" fill="#1C1A24" stroke="#FBF8F0" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
<div id="ring" class="hidden"><div></div></div>

<div id="term" class="hidden"><div class="win">
  <div class="head"><div class="dot" style="background:#FF48B0"></div><div class="dot" style="background:#FFB511"></div><div class="dot" style="background:#B5ED13"></div><div class="title">maya@acme — zsh</div></div>
  <pre id="termText"></pre>
</div></div>

<div id="card" class="hidden"></div>

<script>
const MARK = `__MARK__`;
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function show(id) { for (const el of document.body.children) if (el.id) el.classList.toggle('hidden', el.id !== id); }
window.setUrl = (u) => { const i = u.indexOf('/'); document.getElementById('url').innerHTML = i < 0 ? `<b>${esc(u)}</b>` : `<b>${esc(u.slice(0, i))}</b>${esc(u.slice(i))}`; show('bar'); };
window.setTerm = (st) => {
  const lines = (st.lines || []).map((l, i, a) => {
    if (l.out) return `<span class="ok">${st.status || 200} OK</span><span class="out">${esc(l.s)}</span>`;
    const caret = st.caret && i === a.length - 1 ? '<span class="caret"></span>' : '';
    return `<span class="p">${esc(l.p)}</span>${esc(l.s)}${caret}`;
  });
  if (!lines.length) lines.push('<span class="p">$ </span><span class="caret"></span>');
  document.getElementById('termText').innerHTML = lines.join('\n');
  show('term');
};
const CARDS = {
  intro: { mark: true, title: '5050 <span class="hl">Mail</span>', sub: 'Open-source business email for your own domains: webmail, an admin console and a Resend-compatible API.', tag: 'OPEN SOURCE · AGPL-3.0' },
  mail: { kicker: '01 · WEBMAIL', title: '5050 <span class="hl">Mail</span>', sub: 'Gmail-style webmail on your own domain. Threads, search, labels.' },
  admin: { kicker: '02 · ADMIN CONSOLE', title: 'Domains in <span class="hl">one click</span>', sub: 'Connect a Cloudflare domain and create mailboxes in seconds.' },
  send: { kicker: '03 · EMAIL API', title: '5050 <span class="hl">Send</span>', sub: 'A Resend-compatible email API, SMTP relay and dashboard.' },
  outro: { mark: true, title: 'Self-host it in <span class="hl">one command</span>', cmd: true, foot: '<b>github.com/musakkka/5050-mail</b> · AGPL-3.0' },
};
window.setCard = (name) => {
  const c = CARDS[name];
  const el = document.getElementById('card');
  el.innerHTML = `<div class="inner">
    ${c.mark ? `<div class="mark"><svg viewBox="96 44 844 352" class="plate lime">${MARK.lime}</svg><svg viewBox="96 44 844 352" class="plate aqua" style="mix-blend-mode:multiply">${MARK.aqua}</svg></div>` : ''}
    ${c.kicker ? `<div class="kicker"><i></i>${c.kicker}</div>` : ''}
    <h1>${c.title}</h1>
    ${c.sub ? `<p>${c.sub}</p>` : ''}
    ${c.cmd ? `<div class="cmd"><span class="p">$ </span>curl -fsSL https://raw.githubusercontent.com/musakkka/5050-mail/main/install.sh | bash</div>` : ''}
    ${c.foot ? `<div class="foot">${c.foot}</div>` : ''}
  </div>${c.tag ? `<div class="tag">${c.tag}</div>` : ''}`;
  show('card');
  // Entrance: the two plates slide into register, text rises, the lime highlighter swipes in.
  const ease = 'cubic-bezier(.2,.8,.2,1)';
  const anims = [];
  const lime = el.querySelector('.plate.lime'), aqua = el.querySelector('.plate.aqua');
  if (lime) {
    anims.push(lime.animate([{ transform: 'translate(-26px,-14px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 650, easing: ease, fill: 'both' }));
    anims.push(aqua.animate([{ transform: 'translate(26px,14px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 650, easing: ease, fill: 'both' }));
  }
  let d = lime ? 120 : 0;
  for (const sel of ['.kicker', 'h1', 'p', '.cmd', '.foot', '.tag']) {
    const t = el.querySelector(sel);
    if (!t) continue;
    anims.push(t.animate([{ transform: 'translateY(26px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 520, delay: d, easing: ease, fill: 'both' }));
    d += 90;
  }
  const hl = el.querySelector('.hl');
  if (hl) anims.push(hl.animate([{ '--hl': 0 }, { '--hl': 1 }], { duration: 420, delay: 380, easing: ease, fill: 'both' }));
  for (const a of anims) a.pause();
  window.__anims = anims;
  return Math.max(...anims.map((a) => a.effect.getComputedTiming().endTime));
};
window.seek = (ms) => { for (const a of window.__anims) a.currentTime = ms; };
window.showId = show;
</script>
<script>
  CSS.registerProperty?.({ name: '--hl', syntax: '<number>', inherits: true, initialValue: '1' });
</script>
</body>
</html>
